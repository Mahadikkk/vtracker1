<!DOCTYPE html>
<html>
<head>
    <title>Fake Vehicle Data</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }
        table {
            border-collapse: collapse;
            width: 400px;
        }
        th, td {
            border: 1px solid #222;
            padding: 10px;
            text-align: left;
        }
        th {
            background: #eee;
        }
    </style>
</head>

<body>

    <h2>Vehicle Data (Fake)</h2>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Distance</th>
                <th>Fuel</th>
            </tr>
        </thead>
        <tbody id="data-body">
            <!-- Data will load here -->
        </tbody>
    </table>

    <script>
        // Fake data object
        const fakeData = {
            "21-11-2025": { distance: "5 km", fuel: "1.1 L" },
            "22-11-2025": { distance: "22 km", fuel: "4.5 L" }
        };

        // Load data into table
        const tableBody = document.getElementById("data-body");

        Object.keys(fakeData).forEach(date => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${date}</td>
                <td>${fakeData[date].distance}</td>
                <td>${fakeData[date].fuel}</td>
            `;

            tableBody.appendChild(row);
        });
    </script>

</body>
</html>
